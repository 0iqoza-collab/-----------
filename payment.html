<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طرق الدفع - العطار محمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #1c1d1d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-photo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(20, 20, 20, 0.88), rgba(15, 15, 15, 0.92));
            z-index: -1;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            margin-bottom: 50px;
        }

        .menu-btn, .icon-btn {
            background: none;
            border: none;
            color: #d4af37;
            font-size: 1.3rem;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-flex;
        }

        .menu-btn:hover, .icon-btn:hover {
            transform: scale(1.15);
        }

        .navbar-right, .navbar-left {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .navbar-center {
            text-align: center;
        }

        .brand-name {
            font-size: 1.7rem;
            font-weight: 800;
            color: #d4af37;
            letter-spacing: 0.5px;
        }

        .brand-sub {
            font-size: 0.8rem;
            color: #e5c060;
            opacity: 0.85;
            margin-top: 2px;
        }

        .hero-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #cdb784;
            text-decoration: none;
            font-size: 0.92rem;
            margin-bottom: 25px;
            opacity: 0.85;
            transition: opacity 0.2s;
            align-self: flex-start;
        }

        .back-link:hover {
            opacity: 1;
            color: #e5c060;
        }

        .hero-title {
            font-size: 2.6rem;
            font-weight: 800;
            color: #e5c060;
            margin-bottom: 14px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
            opacity: 0;
            animation: fadeUp 0.6s ease forwards;
        }

        .hero-subtitle {
            font-size: 1.05rem;
            color: #cdb784;
            opacity: 0;
            max-width: 560px;
            line-height: 1.9;
            margin-bottom: 45px;
            font-weight: 500;
            animation: fadeUp 0.6s ease forwards;
            animation-delay: 0.1s;
        }

        /* شبكة بطاقات وسائل الدفع */
        .payment-grid {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .payment-card {
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 32px 18px 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
            cursor: default;
            overflow: hidden;
            opacity: 0;
            transform: translateY(22px);
            animation: fadeUp 0.55s ease forwards;
            transition: transform 0.35s ease, border-color 0.35s ease, background 0.35s ease, box-shadow 0.35s ease;
        }

        .payment-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.14), transparent 70%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .payment-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(212, 175, 55, 0.5);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.45);
        }

        .payment-card:hover::before {
            opacity: 1;
        }

        .payment-icon-wrap {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.18) 0%, rgba(212, 175, 55, 0.03) 75%);
            border: 1px solid rgba(212, 175, 55, 0.25);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            z-index: 1;
        }

        .payment-card:hover .payment-icon-wrap {
            transform: scale(1.1) rotate(-4deg);
            box-shadow: 0 0 22px rgba(212, 175, 55, 0.35);
        }

        .payment-icon-wrap i {
            font-size: 1.6rem;
            color: #d4af37;
        }

        .payment-icon-wrap.icon-pair {
            gap: 4px;
        }

        .payment-icon-wrap.icon-pair i {
            font-size: 1.35rem;
        }

        .payment-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #e5c060;
            z-index: 1;
        }

        .payment-desc {
            font-size: 0.85rem;
            color: #cdcdcd;
            line-height: 1.7;
            opacity: 0.85;
            z-index: 1;
        }

        .secure-note {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #b9b9b9;
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .secure-note i {
            color: #d4af37;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تذييل الموقع */
        .site-footer {
            width: 100%;
            max-width: 1000px;
            margin-top: 60px;
            padding-top: 26px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 22px;
        }

        .footer-links a {
            color: #cdb784;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #e5c060;
        }

        .footer-copy {
            color: #7a7a7a;
            font-size: 0.78rem;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 1.9rem;
            }
            .payment-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .navbar {
                width: 95%;
            }
        }

        @media (max-width: 480px) {
            .payment-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .payment-card, .hero-title, .hero-subtitle {
                animation: none;
                opacity: 1;
                transform: none;
            }
            .payment-card:hover, .payment-card:hover .payment-icon-wrap {
                transform: none;
            }
        }
</style>
</head>
<body>
<img src="images/imag (21).jpg" alt="" class="bg-photo">
<div class="bg-overlay"></div>
<div class="main-container">
<header class="navbar">
<div class="navbar-right">
<button class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
<a href="products.html" class="icon-btn"><i class="fa-solid fa-bag-shopping"></i></a>
<a href="payment.html" class="icon-btn" aria-label="طرق الدفع"><i class="fa-solid fa-credit-card"></i></a>
</div>
<div class="navbar-center">
<div class="brand-name">العطار محمد</div>
<div class="brand-sub">طبيعي وأصيل</div>
</div>
<div class="navbar-left">
<button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
</div>
</header>

<main class="hero-section">
<a href="index.html" class="back-link"><i class="fa-solid fa-arrow-right"></i> العودة للصفحة الرئيسية</a>

<h1 class="hero-title">طرق الدفع</h1>
<p class="hero-subtitle">نوفر وسائل دفع آمنة وسهلة لضمان تجربة تسوق مريحة</p>

<div class="payment-grid" id="paymentGrid"></div>

<div class="secure-note"><i class="fa-solid fa-shield-halved"></i> جميع المعاملات مشفّرة وآمنة بالكامل</div>

<footer class="site-footer">
<div class="footer-links">
<a href="mohammed.html">الرئيسية</a>
<a href="products.html">منتجاتنا</a>
<a href="location.html">الموقع</a>
<a href="payment.html">طرق الدفع</a>
</div>
<div class="footer-copy">© 2026 العطار محمد — جميع الحقوق محفوظة</div>
</footer>
</main>
</div>

<script>
// نظام كامل لطرق الدفع — لإضافة وسيلة دفع جديدة فقط أضف عنصر لهذه القائمة
const paymentMethods = [
    {
        icons: ['fa-brands fa-cc-visa', 'fa-brands fa-cc-mastercard'],
        name: 'Visa / Mastercard',
        desc: 'الدفع باستخدام البطاقات البنكية'
    },
    {
        icons: ['fa-brands fa-cc-apple-pay'],
        name: 'Apple Pay',
        desc: 'الدفع السريع والآمن لمستخدمي أجهزة Apple'
    },
    {
        icons: ['fa-solid fa-money-bill-wave'],
        name: 'الدفع عند الاستلام',
        desc: 'الدفع عند استلام الطلب'
    },
    {
        icons: ['fa-solid fa-bolt'],
        name: 'Thawani',
        desc: 'بوابة الدفع الإلكترونية العُمانية'
    }
];

function renderPaymentMethods() {
    const grid = document.getElementById('paymentGrid');
    grid.innerHTML = paymentMethods.map((m, i) => `
        <div class="payment-card" style="animation-delay:${0.15 + i * 0.09}s">
            <div class="payment-icon-wrap${m.icons.length > 1 ? ' icon-pair' : ''}">
                ${m.icons.map(ic => `<i class="${ic}"></i>`).join('')}
            </div>
            <span class="payment-name">${m.name}</span>
            <span class="payment-desc">${m.desc}</span>
        </div>
    `).join('');
}

renderPaymentMethods();
</script>

</body>
</html>
